# ── Preset 8: Matrix ─────────────────────────────────────────────────────────
# Raw tmux — no Dracula theme required.
# True-black background, bright-green text, heavy-circle ▰▱ bar.
# Font: Nerd Font required (JetBrainsMono NF or Hack NF recommended)
# ---------------------------------------------------------------------------

set -g @opencode-statusline-refresh 2
set -g @opencode-statusline-plugins "session model progressbar percentage cost"

# Bar: bright green filled, dark-green empty (▰▱ heavy circles)
set -g @opencode-statusline-bar-filled-color "colour46"
set -g @opencode-statusline-bar-filled-char  "▰"
set -g @opencode-statusline-bar-empty-char   "▱"
set -g @opencode-statusline-bar-empty-color  "colour22"

# Restore bright-green text after the bar
set -g @opencode-statusline-text-color "colour46"

# Icons: Nerd Font defaults
set -gu @opencode-statusline-icon-model
set -gu @opencode-statusline-icon-branch
set -gu @opencode-statusline-icon-bar
set -gu @opencode-statusline-icon-cost
set -gu @opencode-statusline-icon-session

# ── Raw tmux status bar ───────────────────────────────────────────────────────
set -g status-style        "bg=colour16,fg=colour46"
set -g status-right-length 200
set -g status-left-length  40
set -g status-right        "#[bg=colour16,fg=colour46] #(~/.tmux/plugins/tmux/scripts/opencode-statusline) "
