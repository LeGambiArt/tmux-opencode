# ── Preset 6: Minimal ────────────────────────────────────────────────────────
# Dracula theme integration — cyan text on dark-grey segment.
# No progress bar — just model, cost and percentage. Ultra-compact.
# Font: Nerd Font required (JetBrainsMono NF or Hack NF recommended)
# ---------------------------------------------------------------------------

# Dracula segment setup
set -g @dracula-plugins              "cpu-usage battery time custom:opencode-statusline"
set -g @dracula-custom-plugin-colors "cyan dark_gray"

set -g @opencode-statusline-refresh  5

# No progressbar — saves ~12 columns
set -g @opencode-statusline-plugins  "model percentage cost"

# Icons: Nerd Font defaults (no bar icon needed)
set -gu @opencode-statusline-icon-model
set -gu @opencode-statusline-icon-cost
