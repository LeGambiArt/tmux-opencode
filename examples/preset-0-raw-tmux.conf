# ── Preset 0: Raw tmux ───────────────────────────────────────────────────────
# Plain tmux, no theme plugin required.
# Default gradient bar (green → yellow → red) with block characters.
# Font: any terminal font (no Nerd Font required for emoji fallback icons)
# ---------------------------------------------------------------------------

set -g @opencode-statusline-refresh 5
set -g @opencode-statusline-plugins "model branch progressbar percentage cost"

# Default block bar — gradient fill, dark-grey empty
# (leave filled-color unset to use the automatic green→yellow→red gradient)
set -gu @opencode-statusline-bar-filled-color
set -g  @opencode-statusline-bar-filled-char "█"
set -g  @opencode-statusline-bar-empty-char  "░"
set -g  @opencode-statusline-bar-empty-color "colour236"

# Optional: swap to emoji icons if Nerd Font glyphs don't render
# set -g @opencode-statusline-icon-model   "✨"
# set -g @opencode-statusline-icon-branch  "🌿"
# set -g @opencode-statusline-icon-bar     "🧠"
# set -g @opencode-statusline-icon-cost    "💰"
