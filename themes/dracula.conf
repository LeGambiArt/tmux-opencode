# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  tmux-opencode — dracula theme                                          ║
# ║  https://github.com/LeGambiArt/tmux-opencode                            ║
# ║                                                                          ║
# ║  Authentic Dracula palette with solid-triangle pill edges.               ║
# ║  https://draculatheme.com                                                ║
# ║                                                                          ║
# ║  Requires a Nerd Font in your terminal emulator for edge glyphs.         ║
# ║  JetBrainsMono NF, DroidSansMono NF, Hack NF all include U+E0B0/E0B2.  ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ── Status bar ───────────────────────────────────────────────────────────────
set -g @opencode-theme-status-bg "colour234"   # ≈ #1c1c1c  Dracula background
set -g @opencode-theme-status-fg "colour141"   # ≈ #bd93f9  Dracula purple

# ── Global plugin colours ────────────────────────────────────────────────────
# All plugins inherit these unless overridden per-plugin below.
set -g @opencode-theme-fg "colour141"          # Dracula purple text
set -g @opencode-theme-bg "colour236"          # #303030 pill interior bg

# ── Per-plugin accent colours ────────────────────────────────────────────────
set -g @opencode-theme-branch-fg "colour84"    # ≈ #50fa7b  Dracula green
set -g @opencode-theme-cost-fg   "colour208"   # ≈ #ffb86c  Dracula orange

# ── Progress bar ─────────────────────────────────────────────────────────────
# Dracula purple fill, dark indigo empty, rectangle block characters.
set -g @opencode-theme-bar-filled-color "colour141"
set -g @opencode-theme-bar-empty-color  "colour60"   # ≈ #56406a dark indigo
set -g @opencode-theme-bar-filled-char  "▮"
set -g @opencode-theme-bar-empty-char   "▯"

# ── Separator ────────────────────────────────────────────────────────────────
set -g @opencode-theme-separator "  "  # U+E0B1 Nerd Font thin right chevron

# ── Edge glyphs ──────────────────────────────────────────────────────────────
# Solid triangle edges with FG=colour236 (pill interior bg) against the
# colour234 status bar background — creates the capsule/pill visual effect.
# To disable: set -g @opencode-statusline-left-edge ""
set -g @opencode-theme-left-edge  ""   # U+E0B2 Nerd Font solid left
set -g @opencode-theme-right-edge ""  # U+E0B0 Nerd Font solid right
set -g @opencode-theme-left-edge-fg  "colour236"
set -g @opencode-theme-right-edge-fg "colour236"

# ── Plugin list ──────────────────────────────────────────────────────────────
set -g @opencode-theme-plugins "session model progressbar percentage cost"
