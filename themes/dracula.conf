# ── Dracula theme ─────────────────────────────────────────────────────────────
# Dracula colour palette — no Dracula plugin required.
# Deep purple background, cyan text, green+dark diamond bar.
# Nerd Font required.

# Status bar
set -g @opencode-theme-status-bg "colour53"    # deep purple (#5f005f)
set -g @opencode-theme-status-fg "colour117"   # light cyan (#87d7ff)

# Global text colour
set -g @opencode-theme-fg "colour117"          # light cyan

# Branch: lavender for distinction
set -g @opencode-theme-branch-fg "colour183"   # light violet (#d7afff)

# Progress bar: green fill, dark-blue-purple empty, diamond chars
set -g @opencode-theme-bar-filled-color "colour84"   # medium green (#5fd700)
set -g @opencode-theme-bar-empty-color  "colour60"   # slate (#5f5f87)
set -g @opencode-theme-bar-filled-char  "◆"
set -g @opencode-theme-bar-empty-char   "◇"

# Plugin list
set -g @opencode-theme-plugins "session model progressbar percentage cost"
