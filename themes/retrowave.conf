# ── Retrowave theme ───────────────────────────────────────────────────────────
# Deep purple background, hot-pink text, cyan bar. 80s synthwave sunset.
# Rectangular bar chars. Nerd Font required.

# Status bar
set -g @opencode-theme-status-bg "colour54"    # deep purple (#5f0087)
set -g @opencode-theme-status-fg "colour205"   # hot pink (#ff5faf)

# Global text colour
set -g @opencode-theme-fg "colour205"          # hot pink

# Branch: soft lavender for distinction
set -g @opencode-theme-branch-fg "colour183"   # lavender (#d7afff)

# Cost: golden yellow — warm retrowave sunset colour
set -g @opencode-theme-cost-fg "colour220"     # gold (#ffd700)

# Progress bar: electric cyan fill, dark purple empty, rectangular chars
set -g @opencode-theme-bar-filled-color "colour51"   # electric cyan (#00ffff)
set -g @opencode-theme-bar-empty-color  "colour57"   # dark purple (#5f00af)
set -g @opencode-theme-bar-filled-char  "▮"
set -g @opencode-theme-bar-empty-char   "▯"

# Plugin list
set -g @opencode-theme-plugins "session model progressbar percentage cost"
