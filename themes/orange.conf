# ── Orange theme ──────────────────────────────────────────────────────────────
# Dark grey background, warm orange text. Dot-style progress bar.
# Nerd Font required for icons; dots work without Nerd Font.

# Status bar
set -g @opencode-theme-status-bg "colour237"   # grey (#3a3a3a)
set -g @opencode-theme-status-fg "colour214"   # orange (#ffaf00)

# Global text colour
set -g @opencode-theme-fg "colour214"          # orange

# Branch: amber for distinction
set -g @opencode-theme-branch-fg "colour220"   # gold (#ffd700)

# Progress bar: orange fill, dark empty, dot chars
set -g @opencode-theme-bar-filled-color "colour214"
set -g @opencode-theme-bar-empty-color  "colour236"  # charcoal (#303030)
set -g @opencode-theme-bar-filled-char  "●"
set -g @opencode-theme-bar-empty-char   "○"

# Plugin list
set -g @opencode-theme-plugins "model branch progressbar percentage cost"
