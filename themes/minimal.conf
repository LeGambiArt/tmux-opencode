# ── Minimal theme ─────────────────────────────────────────────────────────────
# Dark background, cyan text. No progress bar — just model, %, cost.
# Saves status bar width. Works with any font for basic display.

# Status bar
set -g @opencode-theme-status-bg "colour235"   # dark grey (#262626)
set -g @opencode-theme-status-fg "colour117"   # pale cyan (#87d7ff)

# Global text colour
set -g @opencode-theme-fg "colour117"          # pale cyan

# Branch: teal for distinction
set -g @opencode-theme-branch-fg "colour73"    # medium teal (#5fafaf)

# Plugin list: no progressbar — widest text efficiency
set -g @opencode-theme-plugins "model percentage cost"
