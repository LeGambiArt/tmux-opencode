# ── Neon Punk theme ───────────────────────────────────────────────────────────
# True black background, hot-pink text. 80s spray-paint wall neon.
# Uses emoji icons — no Nerd Font required for icons.
# Nerd Font still needed for ▰▱ bar chars; replace with # - if unavailable.

# Status bar
set -g @opencode-theme-status-bg "colour16"    # true black (#000000)
set -g @opencode-theme-status-fg "colour201"   # hot pink (#ff00ff)

# Global text colour
set -g @opencode-theme-fg "colour201"          # hot pink

# Branch: electric cyan for contrast
set -g @opencode-theme-branch-fg "colour51"    # electric cyan (#00ffff)

# Cost: neon yellow
set -g @opencode-theme-cost-fg "colour226"     # neon yellow (#ffff00)

# Progress bar: hot-pink fill, dark purple empty
set -g @opencode-theme-bar-filled-color "colour201"
set -g @opencode-theme-bar-empty-color  "colour53"   # dark purple (#5f005f)
set -g @opencode-theme-bar-filled-char  "▰"
set -g @opencode-theme-bar-empty-char   "▱"

# Icons: emoji — works without Nerd Font
set -g @opencode-theme-icon-model   "✨"
set -g @opencode-theme-icon-branch  "🌿"
set -g @opencode-theme-icon-bar     "🧠"
set -g @opencode-theme-icon-cost    "💰"
set -g @opencode-theme-icon-session "💻"

# Plugin list
set -g @opencode-theme-plugins "session model progressbar percentage cost"
