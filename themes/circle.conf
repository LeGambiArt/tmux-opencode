# ── Circle theme ─────────────────────────────────────────────────────────────
# Deep ocean background. Each plugin rendered in its own distinct neon colour
# so every segment is immediately identifiable at a glance.
# Progress bar uses ●○ dot circles — the theme's namesake.
# Cost icon: 💵 money bill (emoji, works without Nerd Font for that segment).
# Nerd Font required for model, branch, bar and session icons.

# Status bar
set -g @opencode-theme-status-bg "colour23"    # deep teal (#005f5f)
set -g @opencode-theme-status-fg "colour51"    # bright cyan (#00ffff)

# Per-plugin colours — each segment gets its own hue
set -g @opencode-theme-session-fg "colour201"  # hot magenta (#ff00ff)
set -g @opencode-theme-model-fg   "colour51"   # bright cyan (#00ffff)
set -g @opencode-theme-branch-fg  "colour82"   # neon green (#5fff00)
set -g @opencode-theme-pct-fg     "colour226"  # neon yellow (#ffff00)
set -g @opencode-theme-cost-fg    "colour214"  # orange (#ffaf00)
set -g @opencode-theme-separator-fg "colour37" # medium teal (#00afaf)

# Cost icon: 💵 money bill emoji (overrides default coin glyph)
set -g @opencode-theme-icon-cost "💵"

# Progress bar: cyan fill, dark-teal empty, dot circles (●○)
set -g @opencode-theme-bar-filled-color "colour51"   # bright cyan (#00ffff)
set -g @opencode-theme-bar-empty-color  "colour23"   # dark teal (#005f5f)
set -g @opencode-theme-bar-filled-char  "●"
set -g @opencode-theme-bar-empty-char   "○"

# Plugin list: all six segments so every distinct colour is visible
set -g @opencode-theme-plugins "session model branch progressbar percentage cost"
