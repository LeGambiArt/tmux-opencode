# ── Circle theme ─────────────────────────────────────────────────────────────
# Deep ocean background. Each plugin is a distinct coloured block with its
# own background and foreground — like a ring of coloured circles.
# All icons use emoji so no Nerd Font is required for this theme.
# Cost uses the 💵 money-bill emoji.

# Status bar base
set -g @opencode-theme-status-bg "colour23"    # deep teal (#005f5f)
set -g @opencode-theme-status-fg "colour255"   # white (separator / fallback)

# ── Per-plugin block colours (bg + fg) ───────────────────────────────────────
# session  → magenta block, white text
set -g @opencode-theme-session-bg "colour201"  # hot magenta (#ff00ff)
set -g @opencode-theme-session-fg "colour16"   # black (#000000)

# model    → cyan block, black text
set -g @opencode-theme-model-bg   "colour51"   # bright cyan (#00ffff)
set -g @opencode-theme-model-fg   "colour16"   # black (#000000)

# branch   → lime green block, black text
set -g @opencode-theme-branch-bg  "colour82"   # neon green (#5fff00)
set -g @opencode-theme-branch-fg  "colour16"   # black (#000000)

# progress bar icon — yellow block
set -g @opencode-theme-bar-bg     "colour226"  # neon yellow (#ffff00)
set -g @opencode-theme-bar-fg     "colour16"   # black (#000000)

# percentage → orange block, black text
set -g @opencode-theme-pct-bg     "colour214"  # orange (#ffaf00)
set -g @opencode-theme-pct-fg     "colour16"   # black (#000000)

# cost     → red block, white text
set -g @opencode-theme-cost-bg    "colour196"  # bright red (#ff0000)
set -g @opencode-theme-cost-fg    "colour255"  # white (#eeeeee)

# ── Emoji icons — no Nerd Font required ──────────────────────────────────────
set -g @opencode-theme-icon-model   "🔮"
set -g @opencode-theme-icon-branch  "🌿"
set -g @opencode-theme-icon-bar     "🧠"
set -g @opencode-theme-icon-cost    "💵"
set -g @opencode-theme-icon-session "💻"

# ── Progress bar: cyan fill on yellow bg, dark-teal empty ────────────────────
set -g @opencode-theme-bar-filled-color "colour51"   # bright cyan
set -g @opencode-theme-bar-empty-color  "colour23"   # dark teal (blend with bg)
set -g @opencode-theme-bar-filled-char  "●"
set -g @opencode-theme-bar-empty-char   "○"

# ── Minimal separator — single space so blocks sit nearly adjacent ────────────
# A single space is detectable by tmux (empty string falls back to default │).
# The whitespace-only check in status.sh skips the " │ " treatment and emits
# only the bare space, giving a tight gap between coloured blocks.
set -g @opencode-theme-separator " "

# ── Plugin list: all six segments so every colour block is visible ────────────
set -g @opencode-theme-plugins "session model branch progressbar percentage cost"
