# ── Matrix theme ─────────────────────────────────────────────────────────────
# True-black background, bright-green text. Nerd Font required.
# Evokes the Matrix digital rain aesthetic.

# Status bar
set -g @opencode-theme-status-bg "colour16"    # true black (#000000)
set -g @opencode-theme-status-fg "colour46"    # bright green (#00ff00)

# Global text colour
set -g @opencode-theme-fg "colour46"           # bright green

# Branch: slightly dimmer green so it's visually distinct
set -g @opencode-theme-branch-fg "colour28"    # dark green (#008700)

# Progress bar: green fill, dark-green empty
set -g @opencode-theme-bar-filled-color "colour46"
set -g @opencode-theme-bar-empty-color  "colour22"   # very dark green (#005f00)
set -g @opencode-theme-bar-filled-char  "▰"
set -g @opencode-theme-bar-empty-char   "▱"

# Plugin list
set -g @opencode-theme-plugins "session model progressbar percentage cost"
