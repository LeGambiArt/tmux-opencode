# ── Forest theme ───────────────────────────────────────────────────────────
# Dark green background, bright green text. Session-name aware.
# Evokes a terminal-operator feel. Nerd Font required.

# Status bar
set -g @opencode-theme-status-bg "colour22"    # dark green (#005f00)
set -g @opencode-theme-status-fg "colour46"    # bright green (#00ff00)

# Global text colour
set -g @opencode-theme-fg "colour46"           # bright green

# Branch: mid green for distinction
set -g @opencode-theme-branch-fg "colour76"    # medium green

# Progress bar: bright-green fill, forest-green empty
set -g @opencode-theme-bar-filled-color "colour46"
set -g @opencode-theme-bar-empty-color  "colour28"   # forest green (#008700)
set -g @opencode-theme-bar-filled-char  "█"
set -g @opencode-theme-bar-empty-char   "░"

# Plugin list: includes session for operator forest feel
set -g @opencode-theme-plugins "session model branch progressbar percentage cost"
