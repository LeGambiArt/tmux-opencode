# ── Steel theme ───────────────────────────────────────────────────────────────
# Dark background, steel-blue text. Cool industrial aesthetic.
# Nerd Font required.

# Status bar
set -g @opencode-theme-status-bg "colour236"   # dark charcoal (#303030)
set -g @opencode-theme-status-fg "colour81"    # steel blue (#5fd7ff)

# Global text colour
set -g @opencode-theme-fg "colour81"           # steel blue

# Branch: lighter cyan-blue
set -g @opencode-theme-branch-fg "colour117"   # pale cyan (#87d7ff)

# Progress bar: steel-blue fill, dark fill, block chars
set -g @opencode-theme-bar-filled-color "colour81"
set -g @opencode-theme-bar-empty-color  "colour237"  # slightly lighter dark (#3a3a3a)
set -g @opencode-theme-bar-filled-char  "█"
set -g @opencode-theme-bar-empty-char   "░"

# Plugin list
set -g @opencode-theme-plugins "model branch progressbar percentage cost"
