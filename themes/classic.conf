# ── Classic theme ─────────────────────────────────────────────────────────────
# Dark charcoal background, white text, gradient block bar.
# Clean, professional dark terminal look. Nerd Font required.

# Status bar
set -g @opencode-theme-status-bg "colour235"   # dark grey (#262626)
set -g @opencode-theme-status-fg "colour255"   # near white (#eeeeee)

# Global text colour
set -g @opencode-theme-fg "colour255"          # near white

# Branch: lighter grey for distinction
set -g @opencode-theme-branch-fg "colour252"   # light grey (#d0d0d0)

# Progress bar: dynamic gradient (no bar-filled-color = auto gradient)
set -g @opencode-theme-bar-empty-color "colour238"   # dark grey (#444444)
set -g @opencode-theme-bar-filled-char "█"
set -g @opencode-theme-bar-empty-char  "░"

# Plugin list
set -g @opencode-theme-plugins "model branch progressbar percentage cost"
