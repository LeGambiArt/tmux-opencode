# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  tmux-opencode — default theme                                          ║
# ║  https://github.com/LeGambiArt/tmux-opencode                            ║
# ║                                                                          ║
# ║  This file is ALWAYS sourced first before any named theme.               ║
# ║  It establishes safe defaults for every option the plugin supports.      ║
# ║  A named theme only overrides the options it cares about; everything     ║
# ║  else inherits from here.                                                ║
# ║                                                                          ║
# ║  All options use the @opencode-theme-* namespace.                        ║
# ║  User overrides use @opencode-statusline-* (those always win).           ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ── Status bar colours ───────────────────────────────────────────────────────
# Sets the tmux status-style bg and fg for the entire status bar.
# Unset here (set -gu) so tmux uses its own default colours between themes.
# Named themes override these with their own set -g commands.
# User override: add `set -g status-style "bg=... fg=..."` after TPM run.
#
set -gu @opencode-theme-status-bg
set -gu @opencode-theme-status-fg

# ── Global foreground / background fallback ──────────────────────────────────
# Fallback colour used for all plugins when no per-plugin colour is set.
# Set to "default" here so all plugins inherit the terminal's own fg/bg
# (i.e. whatever status-style defines). This ensures readability on any
# default tmux colour scheme without forcing specific colour codes.
# Named themes override these with their own specific colours.
#
set -g @opencode-theme-fg "default"
set -gu @opencode-theme-bg

# ── Per-plugin foreground / background ──────────────────────────────────────
# Override colour for a specific plugin only.
# Priority: @opencode-statusline-<plugin>-fg > @opencode-statusline-fg
#         > @opencode-theme-<plugin>-fg      > @opencode-theme-fg
#         > hardcoded fallback
#
# Plugins: model, branch, pct, cost, session, separator
# Unset here so switching themes cleanly resets per-plugin overrides.
#
set -gu @opencode-theme-model-fg
set -gu @opencode-theme-model-bg
set -gu @opencode-theme-branch-fg
set -gu @opencode-theme-branch-bg
set -gu @opencode-theme-pct-fg
set -gu @opencode-theme-pct-bg
set -gu @opencode-theme-cost-fg
set -gu @opencode-theme-cost-bg
set -gu @opencode-theme-session-fg
set -gu @opencode-theme-session-bg
set -gu @opencode-theme-separator-fg

# ── Icons ────────────────────────────────────────────────────────────────────
# Nerd Font glyph defaults. Requires a Nerd Font installed and configured
# in your terminal emulator (JetBrainsMono NF, Hack NF, etc.).
#
# NOTE: Icon defaults cannot use $'\uXXXX' syntax here — tmux source-file
# does not support bash ANSI-C quoting. Icons are set by scripts/utils.sh
# via `tmux set-option` (bash interprets the escapes correctly).
#
# To override an icon in a named theme, set the actual UTF-8 character:
#   set -g @opencode-theme-icon-model "󱓷"    ← paste the Nerd Font glyph
# To override as a user in tmux.conf:
#   set -g @opencode-statusline-icon-model "🔮"
#
# Default icons set by utils.sh (Nerd Font glyph  |  emoji fallback):
#
#   model       U+F1102  nf-md-crystal_ball    🔮   "magic oracle / AI model"
#   branch      U+F062C  nf-md-source_branch   🌿   "git branch"
#   progressbar U+E28C   nf-fae-brain          🧠   "context window usage"
#   cost        U+F0DEA  nf-md-coin            💰   "session cost in USD"
#   session     U+F0379  nf-md-monitor         💻   "opencode session title"
#
# To switch all icons to emoji (works without Nerd Fonts):
#   set -g @opencode-statusline-icon-model   "🔮"
#   set -g @opencode-statusline-icon-branch  "🌿"
#   set -g @opencode-statusline-icon-bar     "🧠"
#   set -g @opencode-statusline-icon-cost    "💰"   # alt: "💵" (money bill)
#   set -g @opencode-statusline-icon-session "💻"

# ── Separator ────────────────────────────────────────────────────────────────
# Character placed between each plugin segment.
# Default: │ (U+2502 BOX DRAWINGS LIGHT VERTICAL)
# Alternatives: | (ASCII), ● (dot), · (middle dot), empty string (no sep)
#
set -g @opencode-theme-separator "│"

# ── Progress bar characters ──────────────────────────────────────────────────
# Controls what characters are used for filled and empty bar segments.
# Filled character is repeated for the completed portion; empty for the rest.
#
# Common alternatives:
#   Blocks:  █ ▓ ▒ ░   Circles: ● ○   Heavy: ▰ ▱   Diamonds: ◆ ◇
#   Rects:   ▮ ▯       ASCII:   # -   Dots:  • ·
#
set -g @opencode-theme-bar-filled-char "█"
set -g @opencode-theme-bar-empty-char  "░"

# ── Progress bar colours ─────────────────────────────────────────────────────
# @opencode-theme-bar-filled-color: colour for filled portion.
# Unset here (set -gu) to use the built-in green→yellow→red gradient that
# changes automatically based on context window usage percentage.
# Named themes set this to a fixed colour to override the gradient.
#
# @opencode-theme-bar-empty-color: colour for empty portion.
# colour236 (#303030) works well on most dark terminals.
#
# colour27 (#005fff blue) contrasts clearly on tmux's default green background.
# Themes that prefer the green→yellow→red gradient explicitly unset this.
set -g @opencode-theme-bar-filled-color "colour27"
set -g @opencode-theme-bar-empty-color  "default"

# ── Progress bar width ───────────────────────────────────────────────────────
# Number of characters in the progress bar (default: 10).
# Increase for wider bars, decrease to save status bar width.
#
set -g @opencode-theme-bar-width "10"

# ── Plugin list ──────────────────────────────────────────────────────────────
# Ordered list of segments to display. Available plugins:
#   model       — current AI model name (always shown)
#   branch      — git branch + dirty/staged marks (skipped outside git repos)
#   progressbar — context window fill bar
#   percentage  — context window percentage
#   cost        — cumulative session cost in USD
#   session     — opencode session title (skipped until title is set)
#
# User override: set -g @opencode-statusline-plugins "model percentage cost"
#
set -g @opencode-theme-plugins "model branch progressbar percentage cost"

# ── Session title max length ─────────────────────────────────────────────────
# Maximum number of characters shown for the session title before truncation
# with an ellipsis (…). Default: 20.
#
set -g @opencode-theme-session-max-len "20"

# ── Refresh interval ─────────────────────────────────────────────────────────
# How often (in seconds) tmux refreshes the status bar by re-running status.sh.
# Lower values are more responsive but use more CPU. Default: 5.
# User override: set -g @opencode-statusline-refresh "2"
#
set -g @opencode-theme-refresh "5"
