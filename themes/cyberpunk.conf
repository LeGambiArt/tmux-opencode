# ── Cyberpunk theme ───────────────────────────────────────────────────────────
# Dark navy background, neon-yellow text. Night city aesthetic.
# Diamond bar in yellow+steel-blue. Nerd Font required.

# Status bar
set -g @opencode-theme-status-bg "colour17"    # dark navy (#00005f)
set -g @opencode-theme-status-fg "colour226"   # neon yellow (#ffff00)

# Global text colour
set -g @opencode-theme-fg "colour226"          # neon yellow

# Branch: electric cyan accent
set -g @opencode-theme-branch-fg "colour51"    # electric cyan (#00ffff)

# Cost: hot orange
set -g @opencode-theme-cost-fg "colour214"     # orange (#ffaf00)

# Progress bar: yellow fill, steel-blue empty, diamond chars
set -g @opencode-theme-bar-filled-color "colour226"
set -g @opencode-theme-bar-empty-color  "colour24"   # steel blue (#005f87)
set -g @opencode-theme-bar-filled-char  "◆"
set -g @opencode-theme-bar-empty-char   "◇"

# Plugin list
set -g @opencode-theme-plugins "session model progressbar percentage cost"
