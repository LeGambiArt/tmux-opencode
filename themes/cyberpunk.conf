# ── Cyberpunk theme ───────────────────────────────────────────────────────────
# Near-black background, hot-magenta text, neon-yellow bar, electric-cyan branch.
# Palette: magenta + yellow + cyan on dark — classic cyberpunk neon city.
# Nerd Font required.

# Status bar
set -g @opencode-theme-status-bg "colour16"    # true black (#000000)
set -g @opencode-theme-status-fg "colour201"   # hot magenta (#ff00ff)

# Global text colour
set -g @opencode-theme-fg "colour201"          # hot magenta

# Branch: electric cyan — contrasts strongly with magenta
set -g @opencode-theme-branch-fg "colour51"    # electric cyan (#00ffff)

# Cost: neon yellow — warm neon accent
set -g @opencode-theme-cost-fg "colour226"     # neon yellow (#ffff00)

# Session: hot magenta (matches global fg)
set -g @opencode-theme-session-fg "colour201"

# Progress bar: neon yellow fill, deep purple empty, heavy circle chars
set -g @opencode-theme-bar-filled-color "colour226"  # neon yellow (#ffff00)
set -g @opencode-theme-bar-empty-color  "colour54"   # deep purple (#5f0087)
set -g @opencode-theme-bar-filled-char  "▰"
set -g @opencode-theme-bar-empty-char   "▱"

# Plugin list
set -g @opencode-theme-plugins "session model progressbar percentage cost"
