# ── Purple theme ──────────────────────────────────────────────────────────────
# Dark background, light-purple text, purple+slate rectangular bar.
# Dracula-inspired palette without Dracula plugin dependency.
# Nerd Font required.

# Status bar
set -g @opencode-theme-status-bg "colour236"   # dark charcoal (#303030)
set -g @opencode-theme-status-fg "colour141"   # light purple (#af87ff)

# Global text colour
set -g @opencode-theme-fg "colour141"          # light purple

# Branch: bright green accent
set -g @opencode-theme-branch-fg "colour84"    # medium green (#5fd700)

# Progress bar: purple fill, slate empty, rectangular chars
set -g @opencode-theme-bar-filled-color "colour141"
set -g @opencode-theme-bar-empty-color  "colour60"   # slate (#5f5f87)
set -g @opencode-theme-bar-filled-char  "▮"
set -g @opencode-theme-bar-empty-char   "▯"

# Plugin list
set -g @opencode-theme-plugins "session model progressbar percentage cost"
