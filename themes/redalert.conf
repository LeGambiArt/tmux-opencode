# ── Red Alert theme ───────────────────────────────────────────────────────────
# White background, bright-red text. Signals urgency or attention.
# Nerd Font required for bar glyphs.

# Status bar
set -g @opencode-theme-status-bg "colour255"   # white (#eeeeee)
set -g @opencode-theme-status-fg "colour196"   # bright red (#ff0000)

# Global text colour
set -g @opencode-theme-fg "colour196"          # bright red

# Progress bar: red fill, light-pink empty
set -g @opencode-theme-bar-filled-color "colour196"
set -g @opencode-theme-bar-empty-color  "colour217"  # light rose (#ffafaf)
set -g @opencode-theme-bar-filled-char  "▰"
set -g @opencode-theme-bar-empty-char   "▱"

# Plugin list
set -g @opencode-theme-plugins "session model progressbar percentage cost"
